spring.application.name=capitalhumano-test

# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# CORS
cors.allowed-origins=http://localhost:3000

# Test JWT
jwt.secret=secreto-de-minimo-32-caracteres-para-firmar-tokens-test
jwt.expiration=3600000

# Test LDAP configuration
spring.ldap.urls=ldap://localhost:389
spring.ldap.base=dc=capitalhumano,dc=com
spring.ldap.username=cn=admin,dc=capitalhumano,dc=com
spring.ldap.password=admin

# Test AI key
gemini.api.key=test-api-key
spring.ai.google.genai.api-key=test-api-key
spring.ai.google.genai.chat.model=gemini-2.5-flash
